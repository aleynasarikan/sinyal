# SİNYAL yerel dağıtımı: bağımsız ClickHouse 24.8 + uygulama + nginx.
# UMİ'nin hiçbir servisine/veritabanına bağlanmaz. Portlar yalnız loopback'e açılır.
name: sinyal

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: sinyal
      CLICKHOUSE_USER: sinyal
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD .env dosyasinda tanimli olmali}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - sinyal_clickhouse:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8124:8123"   # yalnız yerel hata ayıklama için; UMİ'nin 8123 portuyla çakışmaz
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      SINYAL_STORE: clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: sinyal
      CLICKHOUSE_USER: sinyal
      SINYAL_TRUST_PROXY: "1"
      SINYAL_SEED_PASSWORD_FILE: /app/var/.sinyal-seed-password
    depends_on:
      clickhouse: { condition: service_healthy }
    volumes:
      - sinyal_var:/app/var
    expose: ["8790"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    volumes:
      - ./deploy/nginx/sinyal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  sinyal_clickhouse:
  sinyal_var:
