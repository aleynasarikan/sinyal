# SİNYAL ters vekil (yerel). Üretimde 443 + TLS sertifikası eklenmeli (docs/GUVENLIK.md).
limit_req_zone $binary_remote_addr zone=sinyal_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sinyal_login:10m rate=5r/m;
# Erişim logunda sorgu dizesi tutulmaz (arama terimleri kişisel veri içerebilir): $request yerine $uri.
log_format sinyal_nq '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 256k;

    access_log /var/log/nginx/access.log sinyal_nq;

    location = /api/auth/login {
        limit_req zone=sinyal_login burst=5 nodelay;
        proxy_pass http://app:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=sinyal_api burst=40 nodelay;
        proxy_pass http://app:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://app:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
